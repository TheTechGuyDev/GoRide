name: Build Android Apps

on:
  push:
    branches: [main]
    paths:
      - 'rider_app/**'
      - 'driver_app/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Optional release key (repo secrets). Without it the debug key is used.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/goride.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/goride.jks" >> "$GITHUB_ENV"
          fi

      - name: Build rider app
        working-directory: rider_app
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/GoRide-Rider.apk"

      - name: Build driver app
        working-directory: driver_app
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/GoRide-Driver.apk"

      - name: Publish download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest GoRide Android apps. Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y %H:%M') UTC."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --notes "$NOTES"
          else
            gh release create android --title "GoRide Android apps" --notes "$NOTES" --latest
          fi
          gh release upload android "$RUNNER_TEMP/GoRide-Rider.apk" "$RUNNER_TEMP/GoRide-Driver.apk" --clobber
