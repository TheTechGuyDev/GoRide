name: Deploy App Previews

on:
  push:
    branches: [main]
    paths:
      - 'rider_app/**'
      - 'driver_app/**'
      - 'admin_app/**'
      - 'packages/**'
      - 'website/**'
      - '.github/workflows/deploy-rider-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Rider app at /GoRide/ride/ (the website is at /GoRide/)
      - name: Build rider app
        working-directory: rider_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/ride/"

      # Driver app at /GoRide/driver/
      - name: Build driver app
        working-directory: driver_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/driver/"

      # Admin dashboard at /GoRide/admin/
      - name: Build admin dashboard
        working-directory: admin_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/admin/"

      - name: Combine sites
        run: |
          mkdir -p site/ride
          cp -r rider_app/build/web/. site/ride/
          mkdir -p site/driver
          cp -r driver_app/build/web/. site/driver/
          mkdir -p site/admin
          cp -r admin_app/build/web/. site/admin/
          # Website: landing page, privacy, terms, account deletion
          cp -r website/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
