name: goride_admin
description: "GoRide admin dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  goride_core:
    path: ../packages/goride_core
  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
    - family: Naira
      fonts:
        - asset: assets/fonts/Naira-500.ttf
          weight: 500
        - asset: assets/fonts/Naira-700.ttf
          weight: 700
