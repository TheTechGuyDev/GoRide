<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GoRide admin dashboard">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07140D">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>GoRide Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #07140D; height: 100%; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, sans-serif; color: #8FA89A; font-size: 14px;
    }
    #loading img { width: 72px; height: 72px; border-radius: 18px; }
    .bar { width: 140px; height: 4px; border-radius: 2px; background: #15301F; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #0CC25F;
      border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="GoRide">
    <div class="bar"></div>
    <div>GoRide Admin</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
