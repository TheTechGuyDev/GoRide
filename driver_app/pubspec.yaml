name: goride_driver
description: "GoRide driver app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  goride_core:
    path: ../packages/goride_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.3
  font_awesome_flutter: ^11.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
    # Urbanist has no ₦ sign; this tiny font supplies just that glyph.
    - family: Naira
      fonts:
        - asset: assets/fonts/Naira-500.ttf
          weight: 500
        - asset: assets/fonts/Naira-700.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#181A20"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
